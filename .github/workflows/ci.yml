name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Integration gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository and family pins
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy, rustfmt
      - name: Run integration gate
        env:
          # Child CI verifies the exact pinned external corpus. The parent facade
          # gate is synthetic-only and must not fetch untracked conformance data.
          OPENCDE_CORPUS_OPTIONAL: "1"
        run: scripts/gate.sh
