[workspace]
resolver = "2"
members = [
    # Canonical openBIM crates. The crate-name-constrained glob deliberately
    # ignores repository control directories such as `.github/`, `docs/`, and
    # `scripts/` inside standard-family submodules.
    "packages/*/openbim-*",
    "packages/facade/openbim",
    # IFC leaf crates and the short aliases that were available on crates.io.
    "packages/ifc/ifc-*",
    "packages/gaeb/gaeb",
    "packages/citygml/citygml",
    "packages/openbimrl/openbimrl",
    "packages/bsdd/bsdd",
    "packages/icdd/icdd",
    "packages/idm/idmxml",
    "packages/loin/loin",
    # Analysis capabilities are neither standards nor `openbim-*` crates.
    "packages/analysis/clash",
    "packages/analysis/diff",
    "bindings/python",
    "apps/*",
]

# `bindings/_deferred-wasm/` is intentionally NOT a member. WASM is deferred
# (see bindings/AGENTS.md); the underscore prefix keeps it out of any future
# `bindings/*` glob as well, so re-adding it is a deliberate act. STEP keeps
# its own workspace metadata while remaining available as an exact path patch.
exclude = ["bindings/_deferred-wasm", "packages/step"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "AGPL-3.0-or-later"
authors = ["point-grey"]

[workspace.dependencies]
# --- ../axiolid: format-agnostic geometry. Knows nothing about IFC. ---
# `axiolid` is the opt-in facade. Leaf crates remain independently consumable.
axiolid = { git = "https://github.com/axiolid/axiolid-kernel.git", rev = "1db0184ba881ec1c1b0459133c2039138a235df9", default-features = false }
axiolid-core = { git = "https://github.com/axiolid/axiolid-kernel.git", rev = "1db0184ba881ec1c1b0459133c2039138a235df9" }
axiolid-mesh = { git = "https://github.com/axiolid/axiolid-kernel.git", rev = "1db0184ba881ec1c1b0459133c2039138a235df9" }
axiolid-model = { git = "https://github.com/axiolid/axiolid-kernel.git", rev = "1db0184ba881ec1c1b0459133c2039138a235df9" }
axiolid-primitive = { git = "https://github.com/axiolid/axiolid-kernel.git", rev = "1db0184ba881ec1c1b0459133c2039138a235df9" }
axiolid-heal = { git = "https://github.com/axiolid/axiolid-kernel.git", rev = "1db0184ba881ec1c1b0459133c2039138a235df9" }
axiolid-profile = { git = "https://github.com/axiolid/axiolid-kernel.git", rev = "1db0184ba881ec1c1b0459133c2039138a235df9" }
axiolid-curve = { git = "https://github.com/axiolid/axiolid-kernel.git", rev = "1db0184ba881ec1c1b0459133c2039138a235df9" }
axiolid-surface = { git = "https://github.com/axiolid/axiolid-kernel.git", rev = "1db0184ba881ec1c1b0459133c2039138a235df9" }
axiolid-topology = { git = "https://github.com/axiolid/axiolid-kernel.git", rev = "1db0184ba881ec1c1b0459133c2039138a235df9" }
axiolid-tessellate = { git = "https://github.com/axiolid/axiolid-kernel.git", rev = "1db0184ba881ec1c1b0459133c2039138a235df9" }
axiolid-spatial = { git = "https://github.com/axiolid/axiolid-kernel.git", rev = "1db0184ba881ec1c1b0459133c2039138a235df9" }
axiolid-measure = { git = "https://github.com/axiolid/axiolid-kernel.git", rev = "1db0184ba881ec1c1b0459133c2039138a235df9" }
# The scalar reference implementation and correctness oracle (ADR 0012).
axiolid-scalar = { git = "https://github.com/axiolid/axiolid-kernel.git", rev = "1db0184ba881ec1c1b0459133c2039138a235df9" }
axiolid-compile = { git = "https://github.com/axiolid/axiolid-kernel.git", rev = "1db0184ba881ec1c1b0459133c2039138a235df9" }
# Contract and implementations are separate crates so feature unification can
# never pull a concrete backend into a format adapter.
axiolid-kernel = { git = "https://github.com/axiolid/axiolid-kernel.git", rev = "1db0184ba881ec1c1b0459133c2039138a235df9", default-features = false }
axiolid-backend-cpu = { git = "https://github.com/axiolid/axiolid-kernel.git", rev = "1db0184ba881ec1c1b0459133c2039138a235df9", default-features = false }
axiolid-backend-gpu = { git = "https://github.com/axiolid/axiolid-kernel.git", rev = "1db0184ba881ec1c1b0459133c2039138a235df9", default-features = false }
# boolmesh-backed provider (ADR 0014). Isolated so `boolmesh` never enters
# axiolid-kernel's graph; the contract crate stays implementation-free.
axiolid-boolmesh = { git = "https://github.com/axiolid/axiolid-kernel.git", rev = "1db0184ba881ec1c1b0459133c2039138a235df9" }

# --- packages/ifc: canonical IFC family pinned from openbimrs/ifc. ---
# Versioned paths keep integration on the exact submodule sources while making
# release metadata explicit across the repository boundary.
ifc-schema = { path = "packages/ifc/ifc-schema", version = "0.1.0" }
openbim-ifc = { path = "packages/ifc/openbim-ifc", version = "0.1.0" }
ifc-step = { path = "packages/ifc/ifc-step", version = "0.1.0" }
ifc-xml = { path = "packages/ifc/ifc-xml", version = "0.1.0" }
ifc-model = { path = "packages/ifc/ifc-model", version = "0.1.0" }
ifc-geometry = { path = "packages/ifc/ifc-geometry", version = "0.1.0", default-features = false }
ifc-properties = { path = "packages/ifc/ifc-properties", version = "0.1.0" }
ifc-template-catalog = { path = "packages/ifc/ifc-template-catalog", version = "0.1.0" }
ifc-cost = { path = "packages/ifc/ifc-cost", version = "0.1.0" }
ifc-schedule = { path = "packages/ifc/ifc-schedule", version = "0.1.0" }
ifc-material = { path = "packages/ifc/ifc-material", version = "0.1.0" }
ifc-style = { path = "packages/ifc/ifc-style", version = "0.1.0" }
ifc-structural = { path = "packages/ifc/ifc-structural", version = "0.1.0" }
ifc-resource = { path = "packages/ifc/ifc-resource", version = "0.1.0" }
ifc-classification = { path = "packages/ifc/ifc-classification", version = "0.1.0" }
ifc-georef = { path = "packages/ifc/ifc-georef", version = "0.1.0" }
ifc-systems = { path = "packages/ifc/ifc-systems", version = "0.1.0" }
ifc-alignment = { path = "packages/ifc/ifc-alignment", version = "0.1.0" }
ifc-validate = { path = "packages/ifc/ifc-validate", version = "0.1.0" }
ifc-author = { path = "packages/ifc/ifc-author", version = "0.1.0" }
ifc-spatial = { path = "packages/ifc/ifc-spatial", version = "0.1.0" }

# --- packages/step: generic ISO 10303 syntax below IFC and standards. ---
# IFC pins the released 0.4.0 parser/schema graph; keep the parent contract
# exact so its patched local source cannot resolve an incompatible STEP API.
openbim-step = { path = "packages/step/openbim-step", version = "0.4.0" }

# --- packages/openbim: standards built ON the IFC layer, never inside it. ---
# One crate per standard. Cargo features are additive across the whole graph,
# so features of a single crate could not keep an RDF stack out of an IDS-only
# build; separate packages can. See docs/adr/0015.
openbim = { path = "packages/facade/openbim", default-features = false }
openbim-core = { path = "packages/core/openbim-core", version = "0.1.0" }
openbim-dt = { path = "packages/dt/openbim-dt", version = "0.2.0" }
openbim-ids = { path = "packages/ids/openbim-ids", version = "0.1.0" }
openbim-gaeb = { path = "packages/gaeb/openbim-gaeb", version = "0.1.3" }
openbim-citygml = { path = "packages/citygml/openbim-citygml", version = "0.1.0" }
openbim-openbimrl = { path = "packages/openbimrl/openbim-openbimrl", version = "0.1.0" }
openbim-bsdd = { path = "packages/bsdd/openbim-bsdd", version = "0.1.0" }
openbim-epd = { path = "packages/epd/openbim-epd", version = "0.1.1" }
openbim-bcf = { path = "packages/bcf/openbim-bcf", version = "0.2.0" }
openbim-icdd = { path = "packages/icdd/openbim-icdd", version = "0.2.0" }
openbim-idm = { path = "packages/idm/openbim-idm", version = "0.1.0" }
openbim-loin = { path = "packages/loin/openbim-loin", version = "0.3.0" }
openbim-mvd = { path = "packages/mvd/openbim-mvd", version = "0.1.0" }

# --- packages/analysis: capabilities, NOT openBIM standards. They consume the
# IFC layer and emit findings that openbim-bcf can export. ---
clash = { path = "packages/analysis/clash" }
diff = { path = "packages/analysis/diff" }

# --- third-party ---
# glam: SIMD-accelerated vector math, pure Rust, no C++. See docs/adr/0003.
glam = "0.29"
thiserror = "2.0"
rayon = "1.10"
smallvec = "1.13"
ahash = "0.8"
memmap2 = "0.9"
criterion = { version = "0.5", features = ["html_reports"] }
quick-xml = "0.37"

# Standalone family repositories use registry dependencies so each can build
# outside this superproject. Integration builds substitute the local source to
# guarantee one package identity and exercise the exact pinned family commits.
[patch.crates-io]
openbim-core = { path = "packages/core/openbim-core" }
openbim-step = { path = "packages/step/openbim-step" }
openbim-dt = { path = "packages/dt/openbim-dt" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1

[profile.bench]
lto = "thin"
codegen-units = 1
debug = true
