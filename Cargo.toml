[workspace]
resolver = "2"
members = [
    "packages/facade/openbim",
    "packages/core/openbim-core",
    "packages/analysis/clash",
    "packages/analysis/diff",
    "bindings/python",
    "apps/*",
]

# Canonical standard-family repositories are developed independently and are
# consumed below as released crates.io versions (ADR 0018). Local clones under packages/ are
# intentionally ignored by this parent workspace.
exclude = ["bindings/_deferred-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "AGPL-3.0-or-later"
authors = ["point-grey"]

[workspace.dependencies]
# --- ../axiolid: format-agnostic geometry. Knows nothing about IFC. ---
# `axiolid` is the opt-in facade. Leaf crates remain independently consumable.
axiolid = { version = "0.3.0", default-features = false }
axiolid-core = { version = "0.3.0" }
axiolid-mesh = { version = "0.3.0" }
axiolid-model = { version = "0.3.0" }
axiolid-primitive = { version = "0.3.0" }
axiolid-heal = { version = "0.3.0" }
axiolid-profile = { version = "0.3.0" }
axiolid-curve = { version = "0.3.0" }
axiolid-surface = { version = "0.3.0" }
axiolid-topology = { version = "0.3.0" }
# (axiolid-tessellate: removed in axiolid 0.3 and unused by the parent)
axiolid-spatial = { version = "0.3.0" }
axiolid-measure = { version = "0.3.0" }
# (axiolid-scalar: removed in axiolid 0.3 and unused by the parent)
# The reference mesh compiler (was axiolid-compile's ScalarCompiler).
axiolid-mesh-compile = { version = "0.3.2" }
axiolid-mesh-compile-contract = { version = "0.3.1" }
# Contracts and providers are separate crates so feature unification can
# never pull a concrete backend into a format adapter.
axiolid-contracts = { version = "0.3.0", default-features = false }
axiolid-backend-cpu = { version = "0.3.0", default-features = false }
axiolid-backend-gpu = { version = "0.3.0", default-features = false }
# The mesh-boolean contract and its boolmesh-backed provider (ADR 0014).
axiolid-mesh-boolean-contract = { version = "0.3.0" }
axiolid-mesh-boolean-boolmesh = { version = "0.3.0" }
# --- Canonical standard-family repositories. ---
# Source is developed in independent repositories and consumed here only as
# released crates.io versions (ADR 0018); Cargo.lock is the exact resolution.
# Never a git or path dependency, and never a [patch] onto a local clone.
ifc-schema = { version = "0.2.2" }
openbim-ifc = { version = "0.4.0" }
ifc-step = { version = "0.2.1" }
ifc-xml = { version = "0.2.0" }
ifc-model = { version = "0.2.2" }
ifc-geometry = { version = "0.3.0", default-features = false }
ifc-properties = { version = "0.2.0" }
ifc-template-catalog = { version = "0.2.0" }
ifc-cost = { version = "0.2.0" }
ifc-schedule = { version = "0.2.0" }
ifc-material = { version = "0.2.0" }
ifc-style = { version = "0.3.0" }
ifc-structural = { version = "0.2.0" }
ifc-resource = { version = "0.2.0" }
ifc-classification = { version = "0.2.0" }
ifc-georef = { version = "0.3.0" }
ifc-systems = { version = "0.2.0" }
ifc-alignment = { version = "0.3.0" }
ifc-validate = { version = "0.2.0" }
ifc-author = { version = "0.2.0" }
ifc-spatial = { version = "0.2.0" }
openbim-step = { version = "0.7.0" }
# The facade itself and shared vocabulary remain in this integration repository
# until they receive standalone canonical repositories.
openbim = { path = "packages/facade/openbim", default-features = false }
openbim-core = { path = "packages/core/openbim-core", version = "0.1.0" }
openbim-dt = { version = "0.3.0" }
openbim-ids = { version = "0.1.2" }
openbim-gaeb = { version = "0.1.2" }
openbim-citygml = { version = "0.1.0" }
openbim-openbimrl = { version = "0.1.0" }
openbim-bsdd = { version = "0.1.0" }
openbim-epd = { version = "0.1.1" }
openbim-bcf = { version = "0.1.0" }
openbim-icdd = { version = "0.2.0" }
openbim-idm = { version = "0.1.0" }
openbim-loin = { version = "0.3.2" }
# openbim-mvd: not on crates.io yet. ADR 0018: the parent does not
# pin unreleased families, so the `mvd` facade feature is withdrawn
# until openbimrs/mvd publishes a release.
# Analysis capabilities are local integration consumers, not standards.
clash = { path = "packages/analysis/clash" }
diff = { path = "packages/analysis/diff" }

# --- third-party ---
# glam: SIMD-accelerated vector math, pure Rust, no C++. See docs/adr/0003.
glam = "0.29"
thiserror = "2.0"
rayon = "1.10"
smallvec = "1.13"
ahash = "0.8"
memmap2 = "0.9"
criterion = { version = "0.5", features = ["html_reports"] }
quick-xml = "0.37"

# Independent family repositories consume the published shared vocabulary.
# Substitute the local integration copy so the graph has one type identity.
[patch.crates-io]
openbim-core = { path = "packages/core/openbim-core" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1

[profile.bench]
lto = "thin"
codegen-units = 1
debug = true
