[workspace]
resolver = "2"
members = [
    "packages/facade/openbim",
    "packages/core/openbim-core",
    "packages/analysis/clash",
    "packages/analysis/diff",
    "bindings/python",
    "apps/*",
]

# Canonical standard-family repositories are developed independently and are
# consumed below as exact Git dependencies. Local clones under packages/ are
# intentionally ignored by this parent workspace.
exclude = ["bindings/_deferred-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "AGPL-3.0-or-later"
authors = ["point-grey"]

[workspace.dependencies]
# --- ../axiolid: format-agnostic geometry. Knows nothing about IFC. ---
# `axiolid` is the opt-in facade. Leaf crates remain independently consumable.
axiolid = { git = "https://github.com/axiolid/axiolid-kernel.git", rev = "1db0184ba881ec1c1b0459133c2039138a235df9", default-features = false }
axiolid-core = { git = "https://github.com/axiolid/axiolid-kernel.git", rev = "1db0184ba881ec1c1b0459133c2039138a235df9" }
axiolid-mesh = { git = "https://github.com/axiolid/axiolid-kernel.git", rev = "1db0184ba881ec1c1b0459133c2039138a235df9" }
axiolid-model = { git = "https://github.com/axiolid/axiolid-kernel.git", rev = "1db0184ba881ec1c1b0459133c2039138a235df9" }
axiolid-primitive = { git = "https://github.com/axiolid/axiolid-kernel.git", rev = "1db0184ba881ec1c1b0459133c2039138a235df9" }
axiolid-heal = { git = "https://github.com/axiolid/axiolid-kernel.git", rev = "1db0184ba881ec1c1b0459133c2039138a235df9" }
axiolid-profile = { git = "https://github.com/axiolid/axiolid-kernel.git", rev = "1db0184ba881ec1c1b0459133c2039138a235df9" }
axiolid-curve = { git = "https://github.com/axiolid/axiolid-kernel.git", rev = "1db0184ba881ec1c1b0459133c2039138a235df9" }
axiolid-surface = { git = "https://github.com/axiolid/axiolid-kernel.git", rev = "1db0184ba881ec1c1b0459133c2039138a235df9" }
axiolid-topology = { git = "https://github.com/axiolid/axiolid-kernel.git", rev = "1db0184ba881ec1c1b0459133c2039138a235df9" }
axiolid-tessellate = { git = "https://github.com/axiolid/axiolid-kernel.git", rev = "1db0184ba881ec1c1b0459133c2039138a235df9" }
axiolid-spatial = { git = "https://github.com/axiolid/axiolid-kernel.git", rev = "1db0184ba881ec1c1b0459133c2039138a235df9" }
axiolid-measure = { git = "https://github.com/axiolid/axiolid-kernel.git", rev = "1db0184ba881ec1c1b0459133c2039138a235df9" }
# The scalar reference implementation and correctness oracle (ADR 0012).
axiolid-scalar = { git = "https://github.com/axiolid/axiolid-kernel.git", rev = "1db0184ba881ec1c1b0459133c2039138a235df9" }
axiolid-compile = { git = "https://github.com/axiolid/axiolid-kernel.git", rev = "1db0184ba881ec1c1b0459133c2039138a235df9" }
# Contract and implementations are separate crates so feature unification can
# never pull a concrete backend into a format adapter.
axiolid-kernel = { git = "https://github.com/axiolid/axiolid-kernel.git", rev = "1db0184ba881ec1c1b0459133c2039138a235df9", default-features = false }
axiolid-backend-cpu = { git = "https://github.com/axiolid/axiolid-kernel.git", rev = "1db0184ba881ec1c1b0459133c2039138a235df9", default-features = false }
axiolid-backend-gpu = { git = "https://github.com/axiolid/axiolid-kernel.git", rev = "1db0184ba881ec1c1b0459133c2039138a235df9", default-features = false }
# boolmesh-backed provider (ADR 0014). Isolated so `boolmesh` never enters
# axiolid-kernel's graph; the contract crate stays implementation-free.
axiolid-boolmesh = { git = "https://github.com/axiolid/axiolid-kernel.git", rev = "1db0184ba881ec1c1b0459133c2039138a235df9" }

# --- Canonical standard-family repositories. ---
# Source is developed in independent repositories. Exact revisions keep this
# integration workspace reproducible without mounting those repositories as
# submodules. The version assertion catches a pin whose package metadata drifted.
ifc-schema = { git = "https://github.com/openbimrs/ifc.git", rev = "e86d55e403ced459259e2c4244c8b97058247e91", version = "0.1.0" }
openbim-ifc = { git = "https://github.com/openbimrs/ifc.git", rev = "e86d55e403ced459259e2c4244c8b97058247e91", version = "0.1.0" }
ifc-step = { git = "https://github.com/openbimrs/ifc.git", rev = "e86d55e403ced459259e2c4244c8b97058247e91", version = "0.1.0" }
ifc-xml = { git = "https://github.com/openbimrs/ifc.git", rev = "e86d55e403ced459259e2c4244c8b97058247e91", version = "0.1.0" }
ifc-model = { git = "https://github.com/openbimrs/ifc.git", rev = "e86d55e403ced459259e2c4244c8b97058247e91", version = "0.1.0" }
ifc-geometry = { git = "https://github.com/openbimrs/ifc.git", rev = "e86d55e403ced459259e2c4244c8b97058247e91", version = "0.1.0", default-features = false }
ifc-properties = { git = "https://github.com/openbimrs/ifc.git", rev = "e86d55e403ced459259e2c4244c8b97058247e91", version = "0.1.0" }
ifc-template-catalog = { git = "https://github.com/openbimrs/ifc.git", rev = "e86d55e403ced459259e2c4244c8b97058247e91", version = "0.1.0" }
ifc-cost = { git = "https://github.com/openbimrs/ifc.git", rev = "e86d55e403ced459259e2c4244c8b97058247e91", version = "0.1.0" }
ifc-schedule = { git = "https://github.com/openbimrs/ifc.git", rev = "e86d55e403ced459259e2c4244c8b97058247e91", version = "0.1.0" }
ifc-material = { git = "https://github.com/openbimrs/ifc.git", rev = "e86d55e403ced459259e2c4244c8b97058247e91", version = "0.1.0" }
ifc-style = { git = "https://github.com/openbimrs/ifc.git", rev = "e86d55e403ced459259e2c4244c8b97058247e91", version = "0.1.0" }
ifc-structural = { git = "https://github.com/openbimrs/ifc.git", rev = "e86d55e403ced459259e2c4244c8b97058247e91", version = "0.1.0" }
ifc-resource = { git = "https://github.com/openbimrs/ifc.git", rev = "e86d55e403ced459259e2c4244c8b97058247e91", version = "0.1.0" }
ifc-classification = { git = "https://github.com/openbimrs/ifc.git", rev = "e86d55e403ced459259e2c4244c8b97058247e91", version = "0.1.0" }
ifc-georef = { git = "https://github.com/openbimrs/ifc.git", rev = "e86d55e403ced459259e2c4244c8b97058247e91", version = "0.1.0" }
ifc-systems = { git = "https://github.com/openbimrs/ifc.git", rev = "e86d55e403ced459259e2c4244c8b97058247e91", version = "0.1.0" }
ifc-alignment = { git = "https://github.com/openbimrs/ifc.git", rev = "e86d55e403ced459259e2c4244c8b97058247e91", version = "0.1.0" }
ifc-validate = { git = "https://github.com/openbimrs/ifc.git", rev = "e86d55e403ced459259e2c4244c8b97058247e91", version = "0.1.0" }
ifc-author = { git = "https://github.com/openbimrs/ifc.git", rev = "e86d55e403ced459259e2c4244c8b97058247e91", version = "0.1.0" }
ifc-spatial = { git = "https://github.com/openbimrs/ifc.git", rev = "e86d55e403ced459259e2c4244c8b97058247e91", version = "0.1.0" }

openbim-step = { git = "https://github.com/openbimrs/step.git", rev = "629278f8d1fd85b080b78535dcb4fb498d347816", version = "0.4.0" }

# The facade itself and shared vocabulary remain in this integration repository
# until they receive standalone canonical repositories.
openbim = { path = "packages/facade/openbim", default-features = false }
openbim-core = { path = "packages/core/openbim-core", version = "0.1.0" }
openbim-dt = { git = "https://github.com/openbimrs/dt.git", rev = "15e38f9ec6dd5c657cea9265456994abe87544ab", version = "0.2.0" }
openbim-ids = { git = "https://github.com/openbimrs/ids.git", rev = "b3627e7321aeb16e11a05fa602391d4cd6be1d14", version = "0.1.0" }
openbim-gaeb = { git = "https://github.com/openbimrs/gaeb.git", rev = "1873d5188b5905c608eb293884acf9c00f102a87", version = "0.1.3" }
openbim-citygml = { git = "https://github.com/openbimrs/citygml.git", rev = "21c27b79e621e5f113a12c1b2ffcb98c3f087b7b", version = "0.1.0" }
openbim-openbimrl = { git = "https://github.com/openbimrs/openbimrl.git", rev = "2d69e31891209d26560ab90da072357adac70e69", version = "0.1.0" }
openbim-bsdd = { git = "https://github.com/openbimrs/bsdd.git", rev = "8d91299adf9938986cf0be57bfc9a7e072a95755", version = "0.1.0" }
openbim-epd = { git = "https://github.com/openbimrs/epd.git", rev = "7fcd98c340e8f0536646c8983184ddd2439d4891", version = "0.1.1" }
openbim-bcf = { git = "https://github.com/openbimrs/bcf.git", rev = "a7d64d63e0cca77a328218640b6191f1839a6410", version = "0.2.0" }
openbim-icdd = { git = "https://github.com/openbimrs/icdd.git", rev = "93a0f3d65d291795e86b166b453247c0dcb27fd3", version = "0.2.0" }
openbim-idm = { git = "https://github.com/openbimrs/idm.git", rev = "7824a2722abf3c3c753d83c0994e37ea10e78cab", version = "0.1.0" }
openbim-loin = { git = "https://github.com/openbimrs/loin.git", rev = "07e486aae96346caa7eb796c2238479d1ca6cd2f", version = "0.3.0" }
openbim-mvd = { git = "https://github.com/openbimrs/mvd.git", rev = "069bddb70b4753f0b4ad1a677b0a277d139abefe", version = "0.1.0" }

# Analysis capabilities are local integration consumers, not standards.
clash = { path = "packages/analysis/clash" }
diff = { path = "packages/analysis/diff" }

# --- third-party ---
# glam: SIMD-accelerated vector math, pure Rust, no C++. See docs/adr/0003.
glam = "0.29"
thiserror = "2.0"
rayon = "1.10"
smallvec = "1.13"
ahash = "0.8"
memmap2 = "0.9"
criterion = { version = "0.5", features = ["html_reports"] }
quick-xml = "0.37"

# Independent family repositories consume the published shared vocabulary.
# Substitute the local integration copy so the graph has one type identity.
[patch.crates-io]
openbim-core = { path = "packages/core/openbim-core" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1

[profile.bench]
lto = "thin"
codegen-units = 1
debug = true
