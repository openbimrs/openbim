[package]
name = "ifc-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Command-line interface: the reference consumer of the library."

[[bin]]
name = "ifc"
path = "src/main.rs"
# The facade library is also called `ifc`, which collides on rustdoc's output
# path (cargo#6313). The CLI's rustdoc has no audience -- users read `--help`,
# not generated docs for a binary -- so it is excluded rather than renaming the
# command, which is the user-facing name.
doc = false

[dependencies]
ifc-schema.workspace = true
ifc-step.workspace = true
ifc-model.workspace = true
ifc-geometry = { workspace = true, features = ["compile-reference-backend"] }
ifc-properties.workspace = true
# Applications may select execution contexts and concrete operation providers:
# the reference mesh compiler with the boolmesh boolean provider.
axiolid-backend-cpu = { workspace = true, features = ["simd"] }
axiolid-core.workspace = true
axiolid-mesh.workspace = true
axiolid-mesh-compile.workspace = true
axiolid-mesh-compile-contract.workspace = true
axiolid-mesh-boolean-boolmesh.workspace = true
axiolid-mesh-boolean-contract.workspace = true
axiolid-contracts.workspace = true
axiolid-model.workspace = true
